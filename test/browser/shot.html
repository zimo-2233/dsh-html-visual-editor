<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>shot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f3f5; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #1f2328; }
  .side { width: 460px; margin: 18px auto; background: #fff; border: 1px solid #d7d9dd; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.10); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #e6e8eb; background: #fafbfc; }
  .fname { font-weight: 600; font-size: 12px; color: #444; }
  .spacer { flex: 1; }
  .btn { border: 1px solid #d0d3d8; background: #fff; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #333; }
  .btn.on { background: #eaf1ff; border-color: #b9cdfb; color: #1f4fd8; }
  .icon { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid #d0d3d8; background: #fff; border-radius: 6px; color: #444; font-size: 13px; }
  .frame { height: 430px; display: flex; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .foot { padding: 6px 10px; border-top: 1px solid #e6e8eb; font-size: 11px; color: #8b929a; background: #fafbfc; }
  .hint { position: absolute; right: 18px; top: 18px; width: 250px; background: #fff; border: 1px solid #d7d9dd; border-radius: 10px; padding: 12px 14px; font-size: 12px; color: #57606a; box-shadow: 0 8px 28px rgba(0,0,0,.10); }
  .hint b { color: #1f2328; display: block; margin-bottom: 6px; }
  .hint code { background: #f2f3f5; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<div class="side">
  <div class="bar">
    <span class="fname">实验报告.html</span>
    <span class="spacer"></span>
    <span class="btn">预览</span>
    <span class="btn on">编辑</span>
    <span class="icon" title="保存">💾</span>
    <span class="icon" title="重新载入">⟳</span>
  </div>
  <div class="frame"><iframe id="f" sandbox="allow-scripts"></iframe></div>
  <div class="foot"><span id="status">连接中…</span> · v0.1.1 · 不自动保存 · 不执行原页面脚本 · 窗口关闭前请保存或导出</div>
</div>
<div class="hint">
  <b>直接改页面，不是改源码</b>
  选中文字即可加粗、改字号与颜色；<code>Ctrl+S</code> 写回原文件，head 与样式原样保留。
</div>
<script src="./engine.browser.js"></script>
<script>
const report = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>实验报告</title>
<style>
 body{font:15px/1.9 "Songti SC",serif;color:#1a1a1a;margin:34px 30px;background:#fffdf8}
 h1{font-size:23px;text-align:center;margin:0 0 6px;letter-spacing:1px}
 .meta{text-align:center;color:#8a7a5c;font-size:12px;margin-bottom:22px}
 h2{font-size:17px;border-bottom:1px solid #d8c9a8;padding-bottom:5px;margin:22px 0 10px}
 p{margin:9px 0;text-indent:2em}
 table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
 td,th{border:1px solid #cfc4ad;padding:6px 9px}
 th{background:#f6efdf}
 .note{background:#f6efdf;border-left:3px solid #c9a227;padding:8px 12px;margin:12px 0;font-size:13px}
 .hl{background:#fff2a8}
</style></head>
<body>
<h1>化学反应速率测定实验报告</h1>
<div class="meta">姓名：zimo-2233　　学号：20260001　　日期：2026-10-22</div>
<h2>一、实验目的</h2>
<p>掌握利用<span class="hl">碘离子催化过氧化氢分解</span>反应测定反应速率的方法，并学会绘制标准曲线求反应速率常数。</p>
<h2>二、实验原理</h2>
<p>过氧化氢在碘离子催化下分解，反应速率与反应物浓度近似成正比。记录不同温度下达到同一浑浊度所需的时间，即可求得反应速率。</p>
<table><tr><th>温度 /℃</th><th>时间 /s</th><th>速率 /mol·s⁻¹</th></tr>
<tr><td>30</td><td>96</td><td>1.04×10⁻⁴</td></tr>
<tr><td>40</td><td>52</td><td>1.92×10⁻⁴</td></tr>
<tr><td>50</td><td>31</td><td>3.23×10⁻⁴</td></tr></table>
<div class="note">说明：表中数值可直接在页面上点选修改，无需切换到源码视图。</div>
<h2>三、结论</h2>
<p>温度升高使反应速率近似按指数增长，活化能约为 53.6 kJ·mol⁻¹。</p>
</body></html>`;

const token = 'shot_' + Math.random().toString(36).slice(2) + 'abcdefgh';
const frame = document.getElementById('f');
frame.srcdoc = HVE.createVisualDocument(report, {token, baseUrl: location.href, parentOrigin: location.origin});
window.addEventListener('message', event => {
  const data = event.data;
  if (!data || data.channel !== 'dsh-html-visual' || data.token !== token) return;
  if (data.type !== 'ready' || !event.ports || !event.ports[0]) return;
  const port = event.ports[0];
  port.onmessage = () => {};
  port.start();
  port.postMessage({channel: 'dsh-html-visual', token, command: 'mode', value: false});
  setTimeout(() => port.postMessage({channel: 'dsh-html-visual', token, command: 'mode', value: true}), 200);
  document.getElementById('status').textContent = '编辑通道就绪';
});
</script>
</body>
</html>
